services:
  - type: web
    name: incois-ocean-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://your-vercel-app-url.vercel.app" # User needs to update this
